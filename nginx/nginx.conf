# Define MIME types globally, outside location blocks
include /etc/nginx/mime.types;  # keep the defaults

# Add your custom types at the http or server level via types block extension
# But since mime.types may not include mjs/wasm, add them with map or default_type overrides below

server {
    listen 80;
    server_name localhost;
    root /var/www/flutter_wasm_app;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Serve .mjs files with correct MIME type
    location ~* \.mjs$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # Serve .wasm files with correct MIME type
    location ~* \.wasm$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        default_type application/wasm;
        try_files $uri =404;
    }

    # Static assets must not fall back to index.html, otherwise binary loaders
    # receive HTML and fail with errors such as "Bad header".
    location ~* \.(riv|png|jpe?g|gif|svg|mp3|wav)$ {
        try_files $uri =404;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Flutter SPA catch-all — no types{} block here
    location / {
        try_files $uri $uri/ /index.html;
    }
}
